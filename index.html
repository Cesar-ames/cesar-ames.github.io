<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti ❤️</title>

<style>
body{
margin:0;
background:linear-gradient(#ff758c,#ff7eb3);
overflow:hidden;
font-family:Arial;
text-align:center;
color:white;
}

h1{
margin-top:60px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
}

.corazon{
position:absolute;
color:red;
font-size:24px;
animation:subir 5s linear infinite;
}

@keyframes subir{
from{bottom:-20px;opacity:1;}
to{bottom:100%;opacity:0;}
}
</style>
</head>

<body>

<h1>Para ti ❤️</h1>

<p>Desde que llegaste a mi vida, todo tiene más sentido.</p>
<p>Tu sonrisa ilumina mis días.</p>
<p>Tu voz calma mi corazón.</p>
<p>Gracias por existir.</p>

<br>

<p>Te quiero muchísimo 💕</p>
<p>Siempre estaré para ti ✨</p>

<script>
setInterval(()=>{
let c=document.createElement("div");
c.className="corazon";
c.innerHTML="❤️";
c.style.left=Math.random()*100+"%";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
},300);
</script>

</body>
</html>
